name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check adapters in sync
        run: python3 scripts/build.py --check

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            adapters/SKILL.md
            adapters/AGENTS.md
            adapters/cursor.mdc
            adapters/openai_tool.json
            adapters/langchain_tool.py
            adapters/system_prompt.txt
            core/policy.md
            scripts/install.sh
